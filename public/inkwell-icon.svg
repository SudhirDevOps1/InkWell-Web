<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" shape-rendering="geometricPrecision">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    
    <!-- Bright Gradient for Glow -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <!-- Metallic 3D Gradient (Light from top-left) -->
    <linearGradient id="penMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="25%" stop-color="#F8FAFC"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Matte Grip -->
    <linearGradient id="penGrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Canvas Dots -->
    <pattern id="canvasDots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.2" fill="#334155" opacity="0.6"/>
    </pattern>

    <!-- Enhanced Shadows for Transparency -->
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#8B5CF6" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="penShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="-10" dy="18" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="minGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="2" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- "InkWell" Text Path -->
    <path id="inkwellText" d="
      M 256 180 L 264 180 M 260 180 L 260 210 M 256 210 L 264 210 
      M 272 210 L 272 180 Q 278 170 284 180 L 284 210 
      M 292 180 L 292 210 M 292 195 L 304 180 M 292 195 L 304 210 
      M 314 180 L 320 210 L 326 195 L 332 210 L 338 180 
      M 348 210 L 348 180 Q 356 180 356 195 L 348 195 
      M 368 180 L 368 210 M 378 180 L 378 210
    " fill="none" stroke="url(#glowGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>

  <!-- Note: The solid background rect has been removed for full transparency -->

  <!-- ===== 1. DIGITAL BOARD ===== -->
  <rect x="76" y="76" width="360" height="280" rx="28" fill="#0F172A" stroke="url(#accent)" stroke-width="5" filter="url(#softShadow)"/>
  <rect x="96" y="96" width="320" height="240" rx="14" fill="#0B1120"/>
  <rect x="96" y="96" width="320" height="240" rx="14" fill="url(#canvasDots)"/>

  <!-- UI Hints -->
  <rect x="120" y="112" width="70" height="5" rx="2.5" fill="#334155" opacity="0.8"/>
  <circle cx="376" cy="114.5" r="3.5" fill="#06B6D4" filter="url(#minGlow)"/>
  <circle cx="390" cy="114.5" r="3.5" fill="#8B5CF6" filter="url(#minGlow)"/>
  <circle cx="404" cy="114.5" r="3.5" fill="#EC4899" filter="url(#minGlow)"/>
  <circle cx="120" cy="315" r="3" fill="#475569" opacity="0.6"/>
  <rect x="130" y="313" width="30" height="4" rx="2" fill="#475569" opacity="0.6"/>

  <!-- ===== 2. MIND-MAP NODES (Left) ===== -->
  <circle cx="170" cy="210" r="24" fill="url(#accent)" filter="url(#minGlow)"/>
  <circle cx="170" cy="210" r="10" fill="#0B1120"/>

  <g stroke="url(#accent)" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <path d="M146 210 C120 185 105 170 95 160"/>
    <path d="M194 210 C220 185 235 170 245 160"/>
    <path d="M146 210 C120 235 105 250 95 260"/>
    <path d="M194 210 C220 235 235 250 245 260"/>
  </g>

  <g fill="#8B5CF6" filter="url(#minGlow)">
    <circle cx="95" cy="160" r="10"/>
    <circle cx="245" cy="160" r="10"/>
    <circle cx="95" cy="260" r="10"/>
    <circle cx="245" cy="260" r="10"/>
  </g>
  <g fill="#0B1120">
    <circle cx="95" cy="160" r="4"/>
    <circle cx="245" cy="160" r="4"/>
    <circle cx="95" cy="260" r="4"/>
    <circle cx="245" cy="260" r="4"/>
  </g>

  <!-- ===== 3. GLOWING "InkWell" TEXT (Right) ===== -->
  <use href="#inkwellText" stroke="url(#glowGrad)" stroke-width="18" opacity="0.2" filter="url(#neonGlow)">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3s" repeatCount="indefinite"/>
  </use>
  <use href="#inkwellText" stroke="url(#glowGrad)" stroke-width="10" opacity="0.5" filter="url(#minGlow)">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3s" repeatCount="indefinite"/>
  </use>
  <use href="#inkwellText" stroke="url(#glowGrad)" stroke-width="7" filter="url(#neonGlow)">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
  </use>

  <!-- ========================================================== -->
  <!-- ===== 4. 🖊️ PREMIUM STYLUS (Tip Neeche, Eraser Uper) ===== -->
  <!-- ========================================================== -->
  <g transform="translate(415, 145) rotate(-12)" filter="url(#penShadow)">
    
    <!-- 1. Tapered Body -->
    <path d="M-11 0 L11 0 L10 155 C10 158 8 160 6 160 L-6 160 C-8 160 -10 158 -10 155 Z" fill="url(#penMetal)"/>
    
    <!-- 2. Left Glass Shine -->
    <path d="M-8 0 L-8 150 L-5 150 L-5 0 Z" fill="#FFFFFF" opacity="0.4"/>
    
    <!-- 3. Right Edge Shadow -->
    <path d="M6 0 L6 150 L8 150 L8 0 Z" fill="#000000" opacity="0.3"/>

    <!-- 4. Matte Grip Zone -->
    <rect x="-10" y="85" width="20" height="30" rx="4" fill="url(#penGrip)"/>

    <!-- 5. AI Smart Glow Ring -->
    <rect x="-12" y="148" width="24" height="8" rx="4" fill="#1E293B"/>
    <rect x="-11" y="150" width="22" height="4" rx="2" fill="url(#glowGrad)" filter="url(#minGlow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
    </rect>

    <!-- 6. Premium Eraser / Top Cap -->
    <rect x="-11" y="-4" width="22" height="14" rx="5" fill="url(#accent)"/>

    <!-- 7. Conical Tip -->
    <path d="M-10 155 C-8 170 -2 180 0 190 C2 180 8 170 10 155 Z" fill="#0B1120"/>
    
    <!-- 8. Writing Nib -->
    <ellipse cx="0" cy="190" rx="4" ry="7" fill="#000000"/>
    <ellipse cx="0" cy="188" rx="2" ry="3" fill="#475569"/>
    
    <!-- 9. Active Dot (Pulse) -->
    <circle cx="0" cy="195" r="3" fill="#22D3EE" filter="url(#minGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
